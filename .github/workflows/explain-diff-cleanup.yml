name: Explain Diff Cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose explain-diff artifacts should be removed"
        required: true
        type: number

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove PR's explanation folder
        run: |
          folder="pr-${{ inputs.pr_number }}"
          if [ -d "$folder" ]; then
            git rm -r "$folder"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove explain-diff output for PR #${{ inputs.pr_number }}"
            git push
          else
            echo "No explain-diff output found for PR #${{ inputs.pr_number }}; nothing to do."
          fi
