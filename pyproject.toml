[project]
name = "tg-language-assistant"
version = "0.1.0"
description = "A Telegram bot that helps language learners with translation, vocabulary, grammar, and corrections."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[webhooks]>=20.0",
    "python-dotenv>=0.21.0",
    "openai>=1.66.0",
    "lingua-language-detector>=2.1.0",
    "loguru>=0.7.3",
    "langgraph>=1.2.9",
    "langsmith>=0.10.10",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = [".venv", ".claude"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E501",  # line too long — ruff format handles wrapping
]
select = [
    "F",     # Pyflakes (unused imports, variables, etc.)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort (import ordering)
    "N",     # pep8-naming conventions
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear (common bugs and design issues)
    "SIM",   # flake8-simplify (simplifiable code)
    "RUF",   # Ruff-specific rules
]
