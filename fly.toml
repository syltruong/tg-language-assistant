# fly.toml app configuration file generated for tg-language-assistant on 2026-05-24T16:29:59+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tg-language-assistant'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# The SQLite file lives here (ADR-0001). Without this mount the database is
# wiped on every deploy. The volume must exist before the first deploy that
# carries this block, or the machine fails to boot:
#   flyctl volumes create data --region fra --size 1
[mounts]
  source = 'data'
  destination = '/app/data'
